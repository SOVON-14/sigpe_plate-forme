asyncapi: 3.0.0
info:
  title: Acquisition Service — Contrat événementiel
  version: 1.0.0-draft
  description: |
    CONTRAT Acquisition Service — événements produits vers l'exchange
    topic sigpe.events.v1 (AMQP 0-9-1).
    Sources : CDC v1.0 §4.4, §4.5, §4.10, catalogue technique v1.1
    §3.1/§3.2, ADR-006/ADR-007,
    enveloppe contracts/json-schemas/enveloppe-evenementiel.schema.json.
    Règles : messages persistants, publisher confirms, routing keys
    domaine.action.vN, livraison at-least-once, consommateurs idempotents.
    acquisition.item_accepted est l'événement qui autorise le passage a
    l'enregistrement patrimonial : SEUL Asset Service cree asset_id et
    le code patrimonial (appel REST POST /assets par Acquisition ou
    consommation par Asset selon décision d'implémentation — le
    contrat OpenAPI Asset fait foi).
    Consommateurs attendus (côté Acquisition) : workflow.instance_completed.
    Statut : BROUILLON EN ATTENTE DE VALIDATION MOA.
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq://rabbitmq:5672
    protocol: amqp
    description: Broker RabbitMQ (AMQP 0-9-1)
channels:
  requestCreated:
    address: sigpe.events.v1/acquisition.request.created.v1
    title: acquisition.request.created.v1
    messages:
      requestCreatedV1:
        $ref: '#/components/messages/requestCreatedV1'
  requestSubmitted:
    address: sigpe.events.v1/acquisition.request.submitted.v1
    title: acquisition.request.submitted.v1
    messages:
      requestSubmittedV1:
        $ref: '#/components/messages/requestSubmittedV1'
  requestSelected:
    address: sigpe.events.v1/acquisition.request.selected.v1
    title: acquisition.request.selected.v1
    messages:
      requestSelectedV1:
        $ref: '#/components/messages/requestSelectedV1'
  requestOrdered:
    address: sigpe.events.v1/acquisition.request.ordered.v1
    title: acquisition.request.ordered.v1
    messages:
      requestOrderedV1:
        $ref: '#/components/messages/requestOrderedV1'
  deliveryRecorded:
    address: sigpe.events.v1/acquisition.delivery.recorded.v1
    title: acquisition.delivery.recorded.v1
    messages:
      deliveryRecordedV1:
        $ref: '#/components/messages/deliveryRecordedV1'
  receptionRecorded:
    address: sigpe.events.v1/acquisition.reception.recorded.v1
    title: acquisition.reception.recorded.v1
    messages:
      receptionRecordedV1:
        $ref: '#/components/messages/receptionRecordedV1'
  itemAccepted:
    address: sigpe.events.v1/acquisition.item_accepted.v1
    title: acquisition.item_accepted.v1
    messages:
      itemAcceptedV1:
        $ref: '#/components/messages/itemAcceptedV1'
  requestClosed:
    address: sigpe.events.v1/acquisition.request.closed.v1
    title: acquisition.request.closed.v1
    messages:
      requestClosedV1:
        $ref: '#/components/messages/requestClosedV1'
  requestCancelled:
    address: sigpe.events.v1/acquisition.request.cancelled.v1
    title: acquisition.request.cancelled.v1
    messages:
      requestCancelledV1:
        $ref: '#/components/messages/requestCancelledV1'
components:
  messages:
    requestCreatedV1:
      name: acquisition.request.created.v1
      title: Demande d'acquisition creee (expression de besoin)
      contentType: application/json
      payload:
        type: object
        required: [request_id, reference, institution_id, requester_account_id, title, item_count]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          organizational_unit_id: { type: string, format: uuid, nullable: true }
          requester_account_id: { type: string, format: uuid }
          title: { type: string }
          priority: { type: string, enum: [low, normal, high, urgent] }
          item_count: { type: integer }
          total_estimated_value: { type: number, nullable: true }
          created_at: { type: string, format: date-time }
    requestSubmittedV1:
      name: acquisition.request.submitted.v1
      title: Demande soumise au circuit Workflow
      contentType: application/json
      payload:
        type: object
        required: [request_id, reference, institution_id, workflow_instance_id]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          workflow_instance_id: { type: string, format: uuid }
          submitted_by: { type: string, format: uuid }
    requestSelectedV1:
      name: acquisition.request.selected.v1
      title: Offre/fournisseur selectionne apres validation
      contentType: application/json
      payload:
        type: object
        required: [request_id, reference, institution_id, supplier_name]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          supplier_name: { type: string }
          supplier_ref: { type: string, format: uuid, nullable: true }
          order_ref: { type: string, nullable: true }
          contracted_total_value: { type: number, nullable: true }
          selected_by: { type: string, format: uuid }
    requestOrderedV1:
      name: acquisition.request.ordered.v1
      title: Commande emise au fournisseur
      contentType: application/json
      payload:
        type: object
        required: [request_id, reference, institution_id, order_ref]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          order_ref: { type: string }
          supplier_name: { type: string }
          ordered_by: { type: string, format: uuid }
          ordered_at: { type: string, format: date-time }
    deliveryRecordedV1:
      name: acquisition.delivery.recorded.v1
      title: Livraison enregistree
      contentType: application/json
      payload:
        type: object
        required: [delivery_id, request_id, reference, institution_id, status]
        properties:
          delivery_id: { type: string, format: uuid }
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          delivery_note_ref: { type: string, nullable: true }
          carrier: { type: string, nullable: true }
          expected_at: { type: string, format: date-time, nullable: true }
          status: { type: string, enum: [expected, arrived, partially_received, fully_received, cancelled] }
    receptionRecordedV1:
      name: acquisition.reception.recorded.v1
      title: Reception controlee enregistree
      contentType: application/json
      payload:
        type: object
        required: [reception_id, delivery_id, request_id, institution_id, status, lines_count]
        properties:
          reception_id: { type: string, format: uuid }
          delivery_id: { type: string, format: uuid }
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          status: { type: string, enum: [partial, complete] }
          lines_count: { type: integer }
          quantity_accepted_total: { type: number }
          quantity_refused_total: { type: number }
          received_by: { type: string, format: uuid, nullable: true }
          received_at: { type: string, format: date-time }
    itemAcceptedV1:
      name: acquisition.item_accepted.v1
      title: Bien accepte — eligible a l'enregistrement patrimonial
      contentType: application/json
      description: |
        Emis pour chaque ligne entierement acceptee (ou fraction
        acceptee). Declenche l'enregistrement chez Asset Service ;
        l'asset_id retourne est rattache a la ligne d'acquisition.
      payload:
        type: object
        required: [request_id, item_id, institution_id, quantity_accepted, reception_id]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          item_id: { type: string, format: uuid }
          reception_id: { type: string, format: uuid }
          institution_id: { type: string, format: uuid }
          organizational_unit_id: { type: string, format: uuid, nullable: true }
          description: { type: string }
          specifications: { type: string, nullable: true }
          quantity_accepted: { type: number }
          unit: { type: string }
          serial_numbers:
            type: array
            items: { type: string }
          category_id: { type: string, format: uuid, nullable: true }
          contracted_unit_value: { type: number, nullable: true }
    requestClosedV1:
      name: acquisition.request.closed.v1
      title: Dossier d'acquisition cloture
      contentType: application/json
      payload:
        type: object
        required: [request_id, reference, institution_id, closed_at]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          asset_ids:
            type: array
            items: { type: string, format: uuid }
            description: Biens enregistres chez Asset
          closed_at: { type: string, format: date-time }
    requestCancelledV1:
      name: acquisition.request.cancelled.v1
      title: Demande d'acquisition annulee
      contentType: application/json
      payload:
        type: object
        required: [request_id, reference, institution_id, motif]
        properties:
          request_id: { type: string, format: uuid }
          reference: { type: string }
          institution_id: { type: string, format: uuid }
          motif: { type: string }
          cancelled_by: { type: string, format: uuid }
          cancelled_at: { type: string, format: date-time }
