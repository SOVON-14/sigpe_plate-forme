asyncapi: 3.0.0
info:
  title: Finance Service Events
  version: 1.0.0-draft
  description: >-
    Evenements du Finance Service (CDC §4.11) : valorisation enregistree,
    amortissement calcule, cout associe, valorisation de sortie et
    repartition de couts. Consomme asset.created,
    maintenance.intervention.completed et workflow.instance_completed.
defaultContentType: application/json
servers:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    protocol: amqp
    description: Exchange topic sigpe.events.v1 (durable, publisher confirms)
channels:
  financeEvents:
    address: sigpe.events.v1
    messages:
      valuationRecorded:
        $ref: '#/components/messages/ValuationRecorded'
      depreciationRecorded:
        $ref: '#/components/messages/DepreciationRecorded'
      costRecorded:
        $ref: '#/components/messages/CostRecorded'
      disposalApproved:
        $ref: '#/components/messages/DisposalApproved'
      disposalExecuted:
        $ref: '#/components/messages/DisposalExecuted'
      disposalClosed:
        $ref: '#/components/messages/DisposalClosed'
operations:
  publishFinanceEvents:
    action: send
    channel:
      $ref: '#/channels/financeEvents'
components:
  messages:
    ValuationRecorded:
      name: finance.valuation_recorded.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DepreciationRecorded:
      name: finance.depreciation_recorded.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    CostRecorded:
      name: finance.cost_recorded.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DisposalApproved:
      name: finance.disposal_approved.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DisposalExecuted:
      name: finance.disposal_executed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DisposalClosed:
      name: finance.disposal_closed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
  schemas:
    EventEnvelope:
      type: object
      required: [event_id, event_type, event_version, producer, aggregate_type, aggregate_id, occurred_at, data]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        event_version: { type: integer, const: 1 }
        producer: { type: string, const: finance-service }
        aggregate_type: { type: string }
        aggregate_id: { type: string, format: uuid }
        institution_id: { type: [string, "null"], format: uuid }
        correlation_id: { type: string, format: uuid }
        causation_id: { type: string, format: uuid }
        actor: { type: object, nullable: true }
        occurred_at: { type: string, format: date-time }
        data: { type: object }
