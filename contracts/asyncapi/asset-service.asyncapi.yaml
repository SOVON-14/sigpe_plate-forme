asyncapi: 3.0.0
info:
  title: Asset Service — Contrat événementiel
  version: 1.0.0-draft
  description: |
    CONTRAT Asset Service — événements produits vers l'exchange
    topic sigpe.events.v1 (AMQP 0-9-1).
    Sources : catalogue v1.1 §6/TEC-017, ADR-006/ADR-007, CDC §4.3-4.7,
    enveloppe contracts/json-schemas/enveloppe-evenementiel.schema.json.
    Règles : messages persistants, publisher confirms, routing keys
    domaine.action.vN, livraison at-least-once, consommateurs idempotents.
    Événement critique : asset.rattachement_confirmed DOIT être émis
    avant la clôture d'un transfert interministériel par Movement.
    Statut : BROUILLON EN ATTENTE DE VALIDATION MOA.
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq://rabbitmq:5672
    protocol: amqp
    description: Broker RabbitMQ (AMQP 0-9-1)
channels:
  assetRegistered:
    address: sigpe.events.v1/asset.registered.v1
    title: asset.registered.v1
    messages:
      assetRegisteredV1:
        $ref: '#/components/messages/assetRegisteredV1'
  assetUpdated:
    address: sigpe.events.v1/asset.updated.v1
    title: asset.updated.v1
    messages:
      assetUpdatedV1:
        $ref: '#/components/messages/assetUpdatedV1'
  assetPhysicalStateChanged:
    address: sigpe.events.v1/asset.physical_state_changed.v1
    title: asset.physical_state_changed.v1
    messages:
      assetPhysicalStateChangedV1:
        $ref: '#/components/messages/assetPhysicalStateChangedV1'
  assetStatusChanged:
    address: sigpe.events.v1/asset.status_changed.v1
    title: asset.status_changed.v1
    messages:
      assetStatusChangedV1:
        $ref: '#/components/messages/assetStatusChangedV1'
  assetRattachementConfirmed:
    address: sigpe.events.v1/asset.rattachement_confirmed.v1
    title: asset.rattachement_confirmed.v1
    messages:
      assetRattachementConfirmedV1:
        $ref: '#/components/messages/assetRattachementConfirmedV1'
operations:
  publishAssetRegistered:
    action: send
    channel:
      $ref: '#/channels/assetRegistered'
    messages:
      - $ref: '#/channels/assetRegistered/messages/assetRegisteredV1'
  publishAssetUpdated:
    action: send
    channel:
      $ref: '#/channels/assetUpdated'
    messages:
      - $ref: '#/channels/assetUpdated/messages/assetUpdatedV1'
  publishAssetPhysicalStateChanged:
    action: send
    channel:
      $ref: '#/channels/assetPhysicalStateChanged'
    messages:
      - $ref: '#/channels/assetPhysicalStateChanged/messages/assetPhysicalStateChangedV1'
  publishAssetStatusChanged:
    action: send
    channel:
      $ref: '#/channels/assetStatusChanged'
    messages:
      - $ref: '#/channels/assetStatusChanged/messages/assetStatusChangedV1'
  publishAssetRattachementConfirmed:
    action: send
    channel:
      $ref: '#/channels/assetRattachementConfirmed'
    messages:
      - $ref: '#/channels/assetRattachementConfirmed/messages/assetRattachementConfirmedV1'
components:
  messages:
    assetRegisteredV1:
      name: asset.registered
      title: Bien enregistré au registre maître (event_version 1)
      contentType: application/json
      payload:
        $ref: '../json-schemas/enveloppe-evenementiel.schema.json'
      examples:
        - name: Exemple enveloppe
          payload:
            event_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e6001
            event_type: asset.registered
            event_version: 1
            occurred_at: '2026-11-13T12:00:00Z'
            producer: asset-service
            aggregate_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e6002
            correlation_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e6003
