asyncapi: 3.0.0
info:
  title: Workflow Service — Contrat événementiel
  version: 1.0.0-draft
  description: |
    CONTRAT Workflow Service — événements produits vers l'exchange
    topic sigpe.events.v1 (AMQP 0-9-1).
    Sources : CDC v1.0 §4.10, ADR-006/ADR-007,
    enveloppe contracts/json-schemas/enveloppe-evenementiel.schema.json.
    Règles : messages persistants, publisher confirms, routing keys
    domaine.action.vN, livraison at-least-once, consommateurs idempotents.
    workflow.instance_completed est l'événement critique attendu par les
    services metiers (Movement, Acquisition...) pour poursuivre leur
    operation — inclut l'outcome approved/rejected/cancelled.
    Statut : BROUILLON EN ATTENTE DE VALIDATION MOA.
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq://rabbitmq:5672
    protocol: amqp
    description: Broker RabbitMQ (AMQP 0-9-1)
channels:
  templateCreated:
    address: sigpe.events.v1/workflow.template_created.v1
    title: workflow.template_created.v1
    messages:
      templateCreatedV1:
        $ref: '#/components/messages/templateCreatedV1'
  instanceStarted:
    address: sigpe.events.v1/workflow.instance_started.v1
    title: workflow.instance_started.v1
    messages:
      instanceStartedV1:
        $ref: '#/components/messages/instanceStartedV1'
  taskDecided:
    address: sigpe.events.v1/workflow.task_decided.v1
    title: workflow.task_decided.v1
    messages:
      taskDecidedV1:
        $ref: '#/components/messages/taskDecidedV1'
  instanceCompleted:
    address: sigpe.events.v1/workflow.instance_completed.v1
    title: workflow.instance_completed.v1
    messages:
      instanceCompletedV1:
        $ref: '#/components/messages/instanceCompletedV1'
operations:
  publishTemplateCreated:
    action: send
    channel:
      $ref: '#/channels/templateCreated'
    messages:
      - $ref: '#/channels/templateCreated/messages/templateCreatedV1'
  publishInstanceStarted:
    action: send
    channel:
      $ref: '#/channels/instanceStarted'
    messages:
      - $ref: '#/channels/instanceStarted/messages/instanceStartedV1'
  publishTaskDecided:
    action: send
    channel:
      $ref: '#/channels/taskDecided'
    messages:
      - $ref: '#/channels/taskDecided/messages/taskDecidedV1'
  publishInstanceCompleted:
    action: send
    channel:
      $ref: '#/channels/instanceCompleted'
    messages:
      - $ref: '#/channels/instanceCompleted/messages/instanceCompletedV1'
components:
  messages:
    templateCreatedV1:
      name: workflow.template_created
      title: Workflow (national ou adaptation) cree (event_version 1)
      contentType: application/json
      payload:
        $ref: '../json-schemas/enveloppe-evenementiel.schema.json'
      examples:
