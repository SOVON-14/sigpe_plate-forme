          payload:
            event_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e8001
            event_type: workflow.template_created
            event_version: 1
            occurred_at: '2026-11-15T08:00:00Z'
            producer: workflow-service
            aggregate_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e8002
            correlation_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e8003
