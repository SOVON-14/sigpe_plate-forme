asyncapi: 3.0.0
info:
  title: Inventory Service — Contrat événementiel
  version: 1.0.0-draft
  description: |
    CONTRAT Inventory Service — événements produits vers l'exchange
    topic sigpe.events.v1 (AMQP 0-9-1).
    Sources : CDC v1.0 §4.6, ADR-006/ADR-007,
    enveloppe contracts/json-schemas/enveloppe-evenementiel.schema.json.
    Règles : messages persistants, publisher confirms, routing keys
    domaine.action.vN, livraison at-least-once, consommateurs idempotents.
    Statut : BROUILLON EN ATTENTE DE VALIDATION MOA.
defaultContentType: application/json
servers:
  rabbitmq:
    host: rabbitmq://rabbitmq:5672
    protocol: amqp
    description: Broker RabbitMQ (AMQP 0-9-1)
channels:
  campaignCreated:
    address: sigpe.events.v1/inventory.campaign_created.v1
    title: inventory.campaign_created.v1
    messages:
      campaignCreatedV1:
        $ref: '#/components/messages/campaignCreatedV1'
  campaignStatusChanged:
    address: sigpe.events.v1/inventory.campaign_status_changed.v1
    title: inventory.campaign_status_changed.v1
    messages:
      campaignStatusChangedV1:
        $ref: '#/components/messages/campaignStatusChangedV1'
  agentAssigned:
    address: sigpe.events.v1/inventory.agent_assigned.v1
    title: inventory.agent_assigned.v1
    messages:
      agentAssignedV1:
        $ref: '#/components/messages/agentAssignedV1'
  agentUnassigned:
    address: sigpe.events.v1/inventory.agent_unassigned.v1
    title: inventory.agent_unassigned.v1
    messages:
      agentUnassignedV1:
        $ref: '#/components/messages/agentUnassignedV1'
  findingRecorded:
    address: sigpe.events.v1/inventory.finding_recorded.v1
    title: inventory.finding_recorded.v1
    messages:
      findingRecordedV1:
        $ref: '#/components/messages/findingRecordedV1'
  findingVerified:
    address: sigpe.events.v1/inventory.finding_verified.v1
    title: inventory.finding_verified.v1
    messages:
      findingVerifiedV1:
        $ref: '#/components/messages/findingVerifiedV1'
operations:
  publishCampaignCreated:
    action: send
    channel:
      $ref: '#/channels/campaignCreated'
    messages:
      - $ref: '#/channels/campaignCreated/messages/campaignCreatedV1'
  publishCampaignStatusChanged:
    action: send
    channel:
      $ref: '#/channels/campaignStatusChanged'
    messages:
      - $ref: '#/channels/campaignStatusChanged/messages/campaignStatusChangedV1'
  publishAgentAssigned:
    action: send
    channel:
      $ref: '#/channels/agentAssigned'
    messages:
      - $ref: '#/channels/agentAssigned/messages/agentAssignedV1'
  publishAgentUnassigned:
    action: send
    channel:
      $ref: '#/channels/agentUnassigned'
    messages:
      - $ref: '#/channels/agentUnassigned/messages/agentUnassignedV1'
  publishFindingRecorded:
    action: send
    channel:
      $ref: '#/channels/findingRecorded'
    messages:
      - $ref: '#/channels/findingRecorded/messages/findingRecordedV1'
  publishFindingVerified:
    action: send
    channel:
      $ref: '#/channels/findingVerified'
    messages:
      - $ref: '#/channels/findingVerified/messages/findingVerifiedV1'
components:
  messages:
    campaignCreatedV1:
      name: inventory.campaign_created
      title: Campagne d'inventaire creee (event_version 1)
      contentType: application/json
      payload:
        $ref: '../json-schemas/enveloppe-evenementiel.schema.json'
      examples:
        - name: Exemple enveloppe
          payload:
            event_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e7001
            event_type: inventory.campaign_created
            event_version: 1
            occurred_at: '2026-11-14T08:00:00Z'
            producer: inventory-service
            aggregate_id: 019a3f2e-7b1c-7d4e-9f2a-1b2c3d4e7002
