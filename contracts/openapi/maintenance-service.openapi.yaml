      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        correlation_id:
          type: string
        errors:
          type: object
          additionalProperties: true
    MaintenanceType:
      type: string
      enum:
      - preventive
      - corrective
      - conditionnelle
      description: Categories locales complementaires autorisees cote ministere
    MaintenanceRequestStatus:
      type: string
      enum:
