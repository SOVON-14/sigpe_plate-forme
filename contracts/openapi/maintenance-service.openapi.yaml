openapi: 3.1.0
info:
  title: Maintenance Service API
  version: 1.0.0-draft
  description: "CONTRAT Maintenance Service — demandes de maintenance, plans\npreventifs, interventions, couts detailles, prestataires et\ngestion des stocks de pieces SIGPE.\nSources : CDC v1.0 §4.8, catalogue\
    \ technique v1.1 §3.1/§3.2,\nADR-003 (references inter-services par UUID sans FK),\nADR-004 (UUIDv7), ADR-005 (RFC 9457).\nRegles metier cles :\n- Types de maintenance : preventive, corrective, conditionnelle\
    \ ;\n  les ministeres peuvent ajouter des categories locales\n  complementaires sans modifier la taxonomie nationale.\n- Interventions realisees par des techniciens internes et/ou des\n  prestataires\
    \ externes (repertoire national partage, relations\n  et evaluations ministerielles).\n- Cout detaille obligatoire a la cloture : main-d'oeuvre, pieces,\n  fournitures, transport, prestations externes,\
    \ autres couts.\n- Approbations selon nature, cout et sensibilite ; voie urgente\n  justifiee avec controle a posteriori obligatoire.\n- Planification manuelle ou automatique selon date, kilometrage,\n\
    \  heures, cycles et etat du bien.\n- Historique complet des interventions, y compris refusees,\n  annulees ou interrompues (jamais de suppression).\n- Plusieurs magasins par ministere : entrees/sorties,\
    \ transferts,\n  inventaires de stock et seuils de reapprovisionnement.\n- Evaluation des prestataires : qualite, delais, budget, pieces,\n  conformite contractuelle, satisfaction.\n- asset_id, institution_id,\
    \ unit_id, account_id, supplier_id sont\n  des UUID de reference SANS cle etrangere inter-services.\n- Consommateurs attendus : workflow.instance_completed.\nStatut : BROUILLON EN ATTENTE DE VALIDATION\
    \ MOA.\nRegles techniques : prefixe /api/v1, JSON, HTTPS, OIDC bearer,\nRBAC+ABAC, X-Correlation-ID/X-Request-ID, idempotence, RFC 9457.\n"
  license:
    name: Licence proprietaire — Gouvernement de la Republique togolaise
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.sigpe.local/api/v1
  description: API Gateway (APISIX)
tags:
- name: health
  description: Sondes de sante
- name: requests
  description: Demandes de maintenance
- name: plans
  description: Plans de maintenance preventive
- name: interventions
  description: Interventions et couts
- name: suppliers
  description: Prestataires et evaluations
- name: stock
  description: Pieces, magasins et mouvements de stock
- name: history
  description: Historique des interventions
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Sonde de sante (sans authentification)
      security: []
      responses:
        '200':
          description: Service operationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: maintenance-service
        '429':
          description: Limitation de debit (APISIX)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service indisponible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /maintenance-requests:
    get:
      tags:
      - requests
      operationId: listMaintenanceRequests
      summary: Liste les demandes de maintenance
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/MaintenanceRequestStatus'
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/MaintenanceType'
      - name: asset_id
        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Liste paginee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequestPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - requests
      operationId: createMaintenanceRequest
      summary: Cree une demande de maintenance
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestCreate'
      responses:
        '201':
          description: Demande creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MaintenanceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /maintenance-requests/{id}:
    get:
      tags:
      - requests
      operationId: getMaintenanceRequest
      summary: Detail d'une demande (avec interventions)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Demande
          content:
            application/json:
              schema:
