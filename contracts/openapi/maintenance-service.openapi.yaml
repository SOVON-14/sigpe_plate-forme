      summary: Annule une demande (motif obligatoire)
      parameters:
      - $ref: '#/components/parameters/IdParam'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motif'
      responses:
        '200':
          description: Demande annulee
          content:
