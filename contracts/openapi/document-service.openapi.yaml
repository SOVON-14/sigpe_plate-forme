openapi: 3.1.0
info:
  title: Document Service API
  version: 1.0.0-draft
  description: |
    CONTRAT Document Service — depot, versions, categories, acces et
    archives des pieces justificatives SIGPE.
    Sources : CDC v1.0 §4.9, catalogue technique v1.1 §8.3,
    ADR-003 (references par UUID sans FK), ADR-004 (UUIDv7),
    ADR-005 (RFC 9457), ADR-006/ADR-007 (evenements).
    Regles metier cles :
    - Huit categories nationales : acquisition, propriete, technique,
      administratif, maintenance, inventaire, financier, reforme.
      Les institutions peuvent ajouter des sous-categories locales.
    - Quatre niveaux de confidentialite : public_administratif,
      interne, confidentiel, hautement_sensible. L'acces depend du
      role, de l'institution, de l'unite et du niveau ; les documents
      confidentiel et hautement_sensible exigent une autorisation
      exceptionnelle temporaire motivee, approuvee et auditee.
    - Toutes les versions sont conservees ; AUCUN ecrasement d'un
      document valide ou signe. Une nouvelle version est un nouvel
      objet ; la precedente reste intacte et interrogeable.
    - Cycle de vie : active -> archives_intermediaires ->
      archives_definitives ; elimination uniquement autorisee et
      motivee. Distinction entre validation interne electronique et
      signature electronique juridiquement reconnue (hors perimetre v1).
    - Chaque fichier fait l'objet d'un controle de format/taille,
      d'une empreinte cryptographique SHA-256 et d'une journalisation
      des consultations et telechargements (document.access_logged).
    - Stockage objet S3-compatible PRIVEE ; les fichiers ne transitent
      jamais par le frontend en clair vers un stockage public.
    - asset_id, institution_id, unit_id, uploaded_by sont des UUID de
      reference SANS cle etrangere inter-services.
    Statut : BROUILLON EN ATTENTE DE VALIDATION MOA.
    Regles techniques : prefixe /api/v1, JSON, HTTPS, OIDC bearer,
    RBAC+ABAC, X-Correlation-ID/X-Request-ID, idempotence, RFC 9457.
    Upload : multipart/form-data (file + champs metadonnes) ou
    application/json pour les metadonnees seules (import par reference).
  license:
    name: Licence proprietaire — Gouvernement de la Republique togolaise
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.sigpe.local/api/v1
  description: API Gateway (APISIX)
tags:
- name: health
  description: Sondes de sante
- name: categories
  description: Taxonomie documentaire nationale
- name: documents
  description: Documents et versions
- name: access
  description: Autorisations d'acces exceptionnelles et journaux
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Sonde de sante (sans authentification)
      security: []
      responses:
        '200':
          description: Service operationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: document-service }
        '429':
          description: Limitation de debit (APISIX)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /document-categories:
    get:
      tags: [categories]
      operationId: listDocumentCategories
      summary: Liste les categories nationales et locales
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Liste paginee des documents (filtres multicriteres)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: category_id
        in: query
        schema: { type: string, format: uuid }
      - name: confidentiality
        in: query
        schema: { type: string, enum: [public_administratif, interne, confidentiel, hautement_sensible] }
      - name: lifecycle_stage
        in: query
        schema: { type: string, enum: [active, archives_intermediaires, archives_definitives, eliminated] }
      - name: asset_id
        in: query
        schema: { type: string, format: uuid }
      - name: q
        in: query
        schema: { type: string }
        description: Recherche sur titre/reference/emetteur
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [documents]
      operationId: createDocument
      summary: Depose un document (multipart avec fichier, ou JSON metadonnees)
      description: |
        En multipart/form-data : champ `file` obligatoire + champs
        metadonnees. En application/json : metadonnees seules —
        le fichier sera verse par import ulterieur (reference_only).
        L'empreinte SHA-256, la taille et le type sont calcules et
        verifies ; les formats non autorises sont rejetes (415).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentUpload' }
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCreate' }
      responses:
        '201':
          description: Document cree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Detail d'un document (metadonnees + versions)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/versions:
    get:
      tags: [documents]
      operationId: listDocumentVersions
      summary: Liste les versions conservees du document
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Versions (chronologique, jamais ecrasees)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [documents]
      operationId: addDocumentVersion
      summary: Ajoute une nouvelle version (aucun ecrasement)
      description: |
        Cree un nouvel objet version ; la version precedente reste
        intacte et interrogeable. Refusee si le document est elimine
        ou si la version courante est validee/signee sans motif
        d'erratum enregistre.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentUpload' }
      responses:
        '201':
          description: Version ajoutee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/validate:
    post:
      tags: [documents]
      operationId: validateDocument
      summary: Validation interne electronique (pas de signature juridique)
      description: |
        Validation interne electronique au sens CDC §4.9 — distincte
        de la signature electronique juridiquement reconnue. Une fois
        validee, la version ne peut plus etre ecrasee ; toute
        correction passe par une nouvelle version.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id: { type: string, format: uuid }
                comment: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Document valide
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/download:
    get:
      tags: [documents]
      operationId: downloadDocument
      summary: Telecharge la version courante (journalise l'acces)
      description: |
        Journalise systématiquement la consultation (document.access_logged).
        Pour les niveaux confidentiel et hautement_sensible, exige un
        access_grant actif de l'appelant — sinon 403.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: version_id
        in: query
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Flux binaire du fichier
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/lifecycle:
    post:
      tags: [documents]
      operationId: transitionDocumentLifecycle
      summary: Transition du cycle de vie archivistique
      description: |
        active -> archives_intermediaires -> archives_definitives.
        L'elimination (archives_definitives -> eliminated) exige un
        motif et la permission document.eliminate ; elle conserve la
        trace et les metadonnees, seul le fichier est retire.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_stage, motif]
              properties:
                target_stage:
                  type: string
                  enum: [archives_intermediaires, archives_definitives, eliminated]
                motif: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Transition appliquee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/access-requests:
    get:
      tags: [access]
      operationId: listAccessRequests
      summary: Liste les demandes d'acces exceptionnel du document
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Demandes d'acces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [access]
      operationId: createAccessRequest
      summary: Demande d'acces exceptionnel motivee (confidentiel+)
      description: |
        Obligatoire pour acceder aux documents de niveau
        confidentiel ou hautement_sensible sans habilitation
        permanente. Motif et duree limites obligatoires ; la demande
        est approuvee par un habilite distinct du demandeur.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestCreate' }
      responses:
        '201':
          description: Demande creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AccessRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /access-requests/{id}/decision:
    post:
      tags: [access]
      operationId: decideAccessRequest
      summary: Approuve ou refuse une demande d'acces exceptionnel
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AccessRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, motif]
              properties:
                decision: { type: string, enum: [approved, denied] }
                motif: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Decision enregistree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AccessRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /documents/{id}/access-log:
    get:
      tags: [access]
      operationId: listDocumentAccessLog
      summary: Journal des consultations et telechargements
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Journal d'acces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccessLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton OIDC Keycloak (claim permissions, institution_id)
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccessRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentification requise
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Permission insuffisante, niveau de confidentialite ou hors perimetre institutionnel
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflit d'etat metier
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation metier impossible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Format de fichier non autorise ou trop volumineux
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limitation de debit (APISIX)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        correlation_id: { type: string, format: uuid }
    DocumentCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: propriete }
        label: { type: string, example: Documents de propriete }
        scope: { type: string, enum: [national, local] }
        parent_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: DOC-2026-000123 }
        title: { type: string }
        category_id: { type: string, format: uuid }
        category_code: { type: [string, 'null'] }
        institution_id: { type: [string, 'null'], format: uuid }
        unit_id: { type: [string, 'null'], format: uuid }
        asset_id: { type: [string, 'null'], format: uuid }
        confidentiality: { type: string, enum: [public_administratif, interne, confidentiel, hautement_sensible] }
        lifecycle_stage: { type: string, enum: [active, archives_intermediaires, archives_definitives, eliminated] }
        current_version: { type: integer }
        version_count: { type: integer }
        retention_until: { type: [string, 'null'], format: date }
        validated_at: { type: [string, 'null'], format: date-time }
        uploaded_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    DocumentDetail:
      allOf:
      - $ref: '#/components/schemas/Document'
      - type: object
        properties:
          description: { type: [string, 'null'] }
          issuer: { type: [string, 'null'] }
          document_date: { type: [string, 'null'], format: date }
          versions:
            type: array
            items: { $ref: '#/components/schemas/DocumentVersion' }
    DocumentVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        version_number: { type: integer }
        original_filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [current, superseded, validated] }
        uploaded_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    DocumentCreate:
      type: object
      required: [title, category_id]
      properties:
        title: { type: string, minLength: 3, maxLength: 300 }
        category_id: { type: string, format: uuid }
        description: { type: string, maxLength: 5000 }
        institution_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        confidentiality: { type: string, enum: [public_administratif, interne, confidentiel, hautement_sensible], default: interne }
        retention_until: { type: string, format: date }
        document_date: { type: string, format: date }
        issuer: { type: string, maxLength: 300 }
        reference: { type: string, maxLength: 100 }
        reference_only: { type: boolean, default: false, description: "Metadonnees seules, fichier importe ulterieurement" }
    DocumentUpload:
      type: object
      required: [file, title, category_id]
      properties:
        file:
          type: string
          format: binary
          description: PDF, PNG, JPG, JPEG, DOCX, XLSX, CSV — max 25 Mo
        title: { type: string, minLength: 3, maxLength: 300 }
        category_id: { type: string, format: uuid }
        description: { type: string, maxLength: 5000 }
        institution_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        confidentiality: { type: string, enum: [public_administratif, interne, confidentiel, hautement_sensible], default: interne }
        retention_until: { type: string, format: date }
        document_date: { type: string, format: date }
        issuer: { type: string, maxLength: 300 }
        reference: { type: string, maxLength: 100 }
    AccessRequestCreate:
      type: object
      required: [motif, requested_until]
      properties:
        motif: { type: string, minLength: 5, maxLength: 2000 }
        requested_until: { type: string, format: date-time }
        scope: { type: string, enum: [view, download], default: view }
    AccessRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        motif: { type: string }
        scope: { type: string, enum: [view, download] }
        requested_until: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, denied, expired, revoked] }
        decided_by: { type: [string, 'null'], format: uuid }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_motif: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    AccessLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        version_id: { type: [string, 'null'], format: uuid }
        actor_id: { type: [string, 'null'], format: uuid }
        action: { type: string, enum: [view, download, validate, access_request, decision] }
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
