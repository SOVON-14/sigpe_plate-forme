# APISIX — mode standalone (data_plane). Routes déclaratives dans ./apisix.yaml.
apisix:
  node_listen: 9080
  enable_admin: false
  enable_ipv6: false
  enable_server_tokens: false

nginx_config:
  error_log_level: warn
  worker_processes: 1
  events:
    worker_connections: 10620
  http:
    lua_shared_dicts:
      etcd-cluster-health-check-stream: 10m
      plugin-limit-req: 10m
      plugin-limit-count: 10m
      plugin-limit-count-html: 10m
      plugin-limit-conn: 10m
      plugin-limit-conn-html: 10m
      plugin-ip-restriction: 10m
      balancer-ewma: 10m
      balancer-ewma-locks: 10m
      balancer-ewma-last-touched-at: 10m
      balancer-ewma-metrics: 10m
      balancer-ewma-usage: 10m
      plugin-api-breaker: 10m
      upstream-healthcheck: 10m

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
